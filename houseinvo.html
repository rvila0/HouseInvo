<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0756a5"
    >

    <title>HomeInvo</title>


    <!-- =====================================================
         WEBSITE TAB ICON / FAVICON
         ===================================================== -->

    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2300d9ff'/%3E%3Cstop offset='1' stop-color='%230a4cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='25' fill='url(%23g)'/%3E%3Cpath d='M20 47L50 22l30 25v32H58V60H42v19H20z' fill='white' opacity='.95'/%3E%3C/svg%3E"
    >


    <!-- =====================================================
         STYLES
         ===================================================== -->

    <style>

        /* =================================================
           RESET
           ================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --deep-blue: #03132f;

            --blue-one: #06498f;

            --blue-two: #0878bd;

            --blue-three: #00bde9;

            --blue-four: #3d63ff;

            --white: #ffffff;

            --muted:
                rgba(255,255,255,0.67);

            --glass:
                rgba(255,255,255,0.105);

            --glass-light:
                rgba(255,255,255,0.16);

            --glass-border:
                rgba(255,255,255,0.22);

            --shadow:
                rgba(0,12,55,0.45);

            --danger:
                #ff3e55;

            --danger-light:
                #ff7585;

        }


        /* =================================================
           BODY
           ================================================= */

        html {
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--white);

            overflow-x: hidden;

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(0,220,255,0.55),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 88% 15%,
                    rgba(40,85,255,0.52),
                    transparent 31%
                ),

                radial-gradient(
                    circle at 75% 85%,
                    rgba(0,180,255,0.43),
                    transparent 34%
                ),

                linear-gradient(
                    125deg,
                    #02102c,
                    #064a87,
                    #0089c5,
                    #164a9e,
                    #020f2b
                );

            background-size:
                180% 180%,
                190% 190%,
                200% 200%,
                500% 500%;

            animation:
                liquidBackground 19s ease-in-out infinite;
        }


        /* =================================================
           LIQUID BACKGROUND
           ================================================= */

        @keyframes liquidBackground {

            0% {

                background-position:
                    0% 35%,
                    100% 20%,
                    70% 100%,
                    0% 50%;
            }

            25% {

                background-position:
                    40% 0%,
                    80% 45%,
                    25% 70%,
                    35% 20%;
            }

            50% {

                background-position:
                    100% 55%,
                    30% 100%,
                    90% 20%,
                    100% 50%;
            }

            75% {

                background-position:
                    55% 100%,
                    0% 50%,
                    40% 5%,
                    65% 80%;
            }

            100% {

                background-position:
                    0% 35%,
                    100% 20%,
                    70% 100%,
                    0% 50%;
            }

        }


        /* =================================================
           LIQUID LIGHT BLOBS
           ================================================= */

        body::before {

            content: "";

            position: fixed;

            width: 430px;
            height: 430px;

            left: -140px;
            top: 12%;

            border-radius: 50%;

            background:
                rgba(0,225,255,0.28);

            filter:
                blur(80px);

            pointer-events: none;

            z-index: 0;

            animation:
                blobOne 15s ease-in-out infinite alternate;
        }


        body::after {

            content: "";

            position: fixed;

            width: 520px;
            height: 520px;

            right: -190px;
            bottom: -130px;

            border-radius: 50%;

            background:
                rgba(40,70,255,0.31);

            filter:
                blur(85px);

            pointer-events: none;

            z-index: 0;

            animation:
                blobTwo 18s ease-in-out infinite alternate;
        }


        @keyframes blobOne {

            0% {

                transform:
                    translate(0,0)
                    scale(1);
            }

            50% {

                transform:
                    translate(150px,-80px)
                    scale(1.22);
            }

            100% {

                transform:
                    translate(75px,110px)
                    scale(0.95);
            }

        }


        @keyframes blobTwo {

            0% {

                transform:
                    translate(0,0)
                    scale(1);
            }

            50% {

                transform:
                    translate(-130px,-100px)
                    scale(1.18);
            }

            100% {

                transform:
                    translate(-65px,65px)
                    scale(1);
            }

        }


        /* =================================================
           APP
           ================================================= */

        .app {

            position: relative;

            z-index: 2;

            min-height: 100vh;

            padding:
                42px 28px 135px;
        }


        .container {

            width:
                min(1180px,100%);

            margin:
                0 auto;
        }


        /* =================================================
           HEADER
           ================================================= */

        .header {

            text-align: center;

            margin-bottom:
                38px;
        }


        .header h1 {

            font-size:
                clamp(40px,6vw,70px);

            font-weight:
                760;

            letter-spacing:
                -2.8px;

            text-shadow:
                0 10px 35px rgba(0,0,0,0.35),
                0 0 35px rgba(0,220,255,0.18);
        }


        .header p {

            margin-top:
                9px;

            color:
                var(--muted);

            font-size:
                15px;
        }


        /* =================================================
           GLASS
           ================================================= */

        .glass {

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.155),
                    rgba(255,255,255,0.055)
                );

            border:
                1px solid var(--glass-border);

            box-shadow:

                0 22px 65px var(--shadow),

                inset 0 1px 0
                rgba(255,255,255,0.22),

                inset 0 -1px 0
                rgba(0,0,0,0.08);

            backdrop-filter:
                blur(25px)
                saturate(140%);

            -webkit-backdrop-filter:
                blur(25px)
                saturate(140%);
        }


        /* =================================================
           PAGE TRANSITIONS
           ================================================= */

        .page-content {

            animation:
                pageIn 0.35s
                cubic-bezier(.2,1,.4,1);
        }


        @keyframes pageIn {

            from {

                opacity: 0;

                transform:
                    translateY(12px)
                    scale(0.985);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =================================================
           BREADCRUMBS
           ================================================= */

        .breadcrumbs {

            display:
                flex;

            flex-wrap:
                wrap;

            align-items:
                center;

            gap:
                7px;

            margin-bottom:
                23px;

            color:
                rgba(255,255,255,0.60);

            font-size:
                14px;
        }


        .breadcrumb {

            cursor:
                pointer;

            transition:
                color 0.2s,
                transform 0.2s;
        }


        .breadcrumb:hover {

            color:
                white;

            transform:
                translateY(-1px);
        }


        .breadcrumb-separator {

            opacity:
                0.35;
        }


        /* =================================================
           PAGE HEADING
           ================================================= */

        .page-heading {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            margin-bottom:
                25px;
        }


        .page-heading h2 {

            font-size:
                32px;

            font-weight:
                720;
        }


        .page-heading p {

            margin-top:
                5px;

            color:
                var(--muted);

            font-size:
                14px;
        }


        /* =================================================
           CARD GRID
           ================================================= */

        .card-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(230px,1fr)
                );

            gap:
                20px;
        }


        /* =================================================
           NORMAL CARD
           ================================================= */

        .card {

            position:
                relative;

            min-height:
                185px;

            padding:
                27px;

            border-radius:
                27px;

            cursor:
                pointer;

            overflow:
                hidden;

            transition:

                transform
                0.25s
                cubic-bezier(.18,1.4,.4,1),

                background
                0.25s,

                box-shadow
                0.25s,

                border-color
                0.25s;
        }


        .card:hover {

            transform:
                translateY(-6px)
                scale(1.012);

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.205),
                    rgba(255,255,255,0.075)
                );

            box-shadow:

                0 27px 75px
                rgba(0,20,75,0.52),

                inset 0 1px 0
                rgba(255,255,255,0.29);
        }


        .card:active {

            transform:
                scale(0.965);
        }


        /* =================================================
           SELECTED CARD
           ================================================= */

        .card.selected {

            border-color:
                rgba(100,225,255,0.72);

            box-shadow:

                0 0 0 2px
                rgba(0,195,255,0.13),

                0 25px 70px
                rgba(0,20,80,0.52),

                inset 0 1px 0
                rgba(255,255,255,0.32);
        }


        .card.selected::before {

            content:
                "SELECTED";

            position:
                absolute;

            right:
                15px;

            bottom:
                14px;

            padding:
                4px 8px;

            border-radius:
                8px;

            font-size:
                9px;

            letter-spacing:
                1px;

            color:
                rgba(255,255,255,0.68);

            background:
                rgba(0,150,220,0.17);
        }


        /* =================================================
           CARD ICON
           ================================================= */

        .card-icon {

            font-size:
                48px;

            margin-bottom:
                16px;

            filter:
                drop-shadow(
                    0 7px 10px
                    rgba(0,0,0,0.25)
                );
        }


        .card h3 {

            font-size:
                21px;

            margin-bottom:
                7px;
        }


        .card-description {

            color:
                var(--muted);

            font-size:
                14px;
        }


        /* =================================================
           CARD MENU
           ================================================= */

        .card-menu {

            position:
                absolute;

            top:
                12px;

            right:
                12px;

            width:
                38px;

            height:
                38px;

            border-radius:
                50%;

            border:
                1px solid
                rgba(255,255,255,0.17);

            background:
                rgba(255,255,255,0.08);

            color:
                white;

            font-size:
                21px;

            cursor:
                pointer;

            z-index:
                3;

            transition:
                transform 0.2s,
                background 0.2s;
        }


        .card-menu:hover {

            background:
                rgba(255,255,255,0.21);

            transform:
                scale(1.1);
        }


        /* =================================================
           ADD CARD
           ================================================= */

        .add-card {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            min-height:
                185px;

            border:
                1px dashed
                rgba(255,255,255,0.32);

            background:
                rgba(255,255,255,0.045);
        }


        .add-card:hover {

            border-color:
                rgba(255,255,255,0.58);
        }


        .add-symbol {

            width:
                58px;

            height:
                58px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            background:
                rgba(255,255,255,0.10);

            font-size:
                30px;

            margin-bottom:
                14px;
        }


        /* =================================================
           MISSING CARD
           ================================================= */

        .missing-card {

            position:
                relative;

            isolation:
                isolate;

            overflow:
                hidden;
        }


        /*
            The red effect is deliberately only around
            the perimeter of the card.
        */

        .missing-card::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            border-radius:
                inherit;

            padding:
                2px;

            background:

                linear-gradient(
                    115deg,
                    transparent 0%,
                    rgba(255,55,75,0.05) 15%,
                    rgba(255,50,70,0.95) 35%,
                    rgba(255,110,120,0.30) 50%,
                    rgba(255,45,65,0.95) 70%,
                    transparent 90%
                );

            background-size:
                250% 250%;

            animation:
                missingBorder 3.5s linear infinite;

            -webkit-mask:
                linear-gradient(#fff 0 0)
                content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite:
                xor;

            mask-composite:
                exclude;

            pointer-events:
                none;

            z-index:
                0;
        }


        .missing-card::after {

            content:
                "";

            position:
                absolute;

            inset:
                1px;

            border-radius:
                inherit;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,45,65,0.08),
                    transparent 42%
                );

            pointer-events:
                none;

            z-index:
                -1;

            animation:
                missingEssence 2.8s ease-in-out infinite;
        }


        @keyframes missingBorder {

            0% {

                background-position:
                    0% 50%;
            }

            50% {

                background-position:
                    100% 50%;
            }

            100% {

                background-position:
                    0% 50%;
            }

        }


        @keyframes missingEssence {

            0%,
            100% {

                opacity:
                    0.35;
            }

            50% {

                opacity:
                    0.85;
            }

        }


        .missing-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

            margin-top:
                10px;

            padding:
                5px 9px;

            border-radius:
                9px;

            color:
                #ffd8dc;

            background:
                rgba(255,40,60,0.13);

            border:
                1px solid
                rgba(255,80,95,0.25);

            font-size:
                11px;

            font-weight:
                650;
        }


        /* =================================================
           ITEM CARD
           ================================================= */

        .item-card {

            min-height:
                180px;

            padding:
                23px;

            border-radius:
                23px;
        }


        .item-top {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;
        }


        .item-icon {

            font-size:
                38px;
        }


        .item-name {

            font-size:
                19px;

            font-weight:
                680;

            margin-top:
                14px;
        }


        .item-quantity {

            margin-top:
                6px;

            color:
                var(--muted);

            font-size:
                14px;
        }


        .item-status {

            margin-top:
                8px;

            font-size:
                12px;

            color:
                rgba(255,255,255,0.62);
        }


        .item-actions {

            display:
                flex;

            gap:
                8px;

            margin-top:
                17px;
        }


        /* =================================================
           BUTTONS
           ================================================= */

        .btn {

            position:
                relative;

            border:
                1px solid
                rgba(255,255,255,0.19);

            color:
                white;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.16),
                    rgba(255,255,255,0.055)
                );

            border-radius:
                15px;

            padding:
                11px 16px;

            font-size:
                14px;

            cursor:
                pointer;

            overflow:
                hidden;

            backdrop-filter:
                blur(15px);

            transition:

                transform
                0.18s
                cubic-bezier(.15,1.5,.4,1),

                background
                0.2s,

                box-shadow
                0.2s;
        }


        .btn:hover {

            background:
                rgba(255,255,255,0.22);

            box-shadow:
                0 7px 25px
                rgba(0,25,80,0.22);
        }


        .btn:active {

            transform:
                scale(1.09);
        }


        .btn-primary {

            background:

                linear-gradient(
                    135deg,
                    rgba(0,195,255,0.45),
                    rgba(36,76,255,0.40)
                );
        }


        .btn-danger:hover {

            background:
                rgba(255,50,70,0.25);
        }


        /* =================================================
           RIPPLE
           ================================================= */

        .ripple {

            position:
                absolute;

            width:
                25px;

            height:
                25px;

            border-radius:
                48% 52% 47% 53%;

            pointer-events:
                none;

            background:

                radial-gradient(
                    circle,
                    rgba(170,245,255,0.48),
                    rgba(0,160,255,0.14),
                    transparent 72%
                );

            transform:
                translate(-50%,-50%)
                scale(0);

            animation:
                liquidRipple
                0.75s
                cubic-bezier(.2,.7,.2,1)
                forwards;

            z-index:
                20;
        }


        @keyframes liquidRipple {

            0% {

                opacity:
                    0.82;

                transform:
                    translate(-50%,-50%)
                    scale(0)
                    rotate(0deg);
            }

            30% {

                opacity:
                    0.67;
            }

            100% {

                opacity:
                    0;

                transform:
                    translate(-50%,-50%)
                    scale(9)
                    rotate(37deg);
            }

        }


        /* =================================================
           HOME MISSING PANEL
           ================================================= */

        .missing-panel {

            margin-top:
                28px;

            padding:
                26px;

            border-radius:
                27px;

            position:
                relative;

            overflow:
                hidden;

            cursor:
                pointer;

            transition:
                transform 0.25s,
                background 0.25s;
        }


        .missing-panel:hover {

            transform:
                translateY(-4px);

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.17),
                    rgba(255,255,255,0.07)
                );
        }


        .missing-panel-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;
        }


        .missing-panel-title {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;
        }


        .alert-icon {

            width:
                48px;

            height:
                48px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                16px;

            background:
                rgba(255,40,60,0.14);

            border:
                1px solid
                rgba(255,90,105,0.22);

            font-size:
                24px;
        }


        .missing-count {

            color:
                rgba(255,255,255,0.66);

            font-size:
                13px;
        }


        .missing-preview {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(180px,1fr)
                );

            gap:
                10px;

            margin-top:
                20px;
        }


        .missing-preview-item {

            padding:
                13px;

            border-radius:
                15px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.10);
        }


        .missing-preview-item strong {

            display:
                block;

            font-size:
                14px;
        }


        .missing-preview-item span {

            display:
                block;

            margin-top:
                4px;

            color:
                rgba(255,255,255,0.55);

            font-size:
                11px;
        }


        /* =================================================
           MISSING LIST
           ================================================= */

        .missing-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                12px;
        }


        .missing-list-item {

            position:
                relative;

            display:
                flex;

            align-items:
                center;

            gap:
                15px;

            padding:
                18px;

            border-radius:
                20px;

            cursor:
                pointer;

            overflow:
                hidden;

            transition:
                transform 0.2s,
                background 0.2s;
        }


        .missing-list-item:hover {

            transform:
                translateX(5px);

            background:
                rgba(255,255,255,0.15);
        }


        .missing-list-item::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                13px;

            bottom:
                13px;

            width:
                3px;

            border-radius:
                5px;

            background:
                linear-gradient(
                    #ff4055,
                    #ff9aa5
                );

            box-shadow:
                0 0 15px
                rgba(255,45,65,0.75);
        }


        .missing-list-icon {

            width:
                48px;

            height:
                48px;

            flex-shrink:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                15px;

            background:
                rgba(255,255,255,0.07);

            font-size:
                25px;
        }


        .missing-list-name {

            font-weight:
                650;

            font-size:
                16px;
        }


        .missing-list-path {

            margin-top:
                4px;

            color:
                rgba(255,255,255,0.55);

            font-size:
                12px;
        }


        .missing-arrow {

            margin-left:
                auto;

            color:
                rgba(255,255,255,0.55);

            font-size:
                20px;
        }


        /* =================================================
           EMPTY STATE
           ================================================= */

        .empty {

            padding:
                65px 25px;

            border-radius:
                25px;

            text-align:
                center;

            color:
                rgba(255,255,255,0.62);

            font-size:
                15px;
        }


        .empty-icon {

            font-size:
                45px;

            margin-bottom:
                12px;
        }


        /* =================================================
           MODAL
           ================================================= */

        .modal {

            position:
                fixed;

            inset:
                0;

        .taskbar {

                center;

            gap:
                7px;
        }


        .task {

            height:

            border-radius:

                20px;

        .task-text {

                6px;

            font-size:
                13px;
        }

           TOAST
           ================================================= */

        .toast {

/* =========================================================
   GET CURRENT LIST
   ========================================================= */

function getCurrentList() {

    let list =
        inventoryData.rooms;


    for (
        let i = 0;
        i < navigationPath.length;
        i++
    ) {

        const index =
            navigationPath[i];


        if (
            !list[index] ||
            !list[index].children
        ) {

            return [];

        }


        list =
            list[index].children;

    }


    return list;

}


/* =========================================================
   GET CURRENT NODE
   ========================================================= */

function getCurrentNode() {

    if (
        navigationPath.length === 0
    ) {

        return null;

    }


    let node =
        inventoryData.rooms[
            navigationPath[0]
        ];


    for (
        let i = 1;
        i < navigationPath.length;
        i++
    ) {

        if (
            !node ||
            !node.children
        ) {

            return null;

        }


        node =
            node.children[
                navigationPath[i]
            ];

    }


    return node;

}


/* =========================================================
   GET NODE AT PATH
   ========================================================= */

function getNodeAtPath(path) {

    if (
        path.length === 0
    ) {

        return null;

    }


    let node =
        inventoryData.rooms[
            path[0]
        ];


    for (
        let i = 1;
        i < path.length;
        i++
    ) {

        if (
            !node ||
            !node.children
        ) {

            return null;

        }


        node =
            node.children[
                path[i]
            ];

    }


    return node;

}


/* =========================================================
   FIND ITEM LOCATION
   ========================================================= */

function findNodeById(
    id,
    list = inventoryData.rooms,
    path = []
) {

    for (
        let i = 0;
        i < list.length;
        i++
    ) {

        const node =
            list[i];


        const currentPath =
            path.concat(i);


        if (
            node.id === id
        ) {

            return {
                node: node,
                path: currentPath
            };

        }


        if (
            node.children &&
            node.children.length
        ) {

            const found =
                findNodeById(
                    id,
                    node.children,
                    currentPath
                );


            if (found) {

                return found;

            }

        }

    }


    return null;

}


/* =========================================================
   GET PATH NAMES
   ========================================================= */

function getPathNames(path) {

    const names = [];


    for (
        let i = 0;
        i < path.length;
        i++
    ) {

        const partial =
            path.slice(
                0,
                i + 1
            );


        const node =
            getNodeAtPath(
                partial
            );


        if (node) {

            names.push(
                node.name
            );

        }

    }


    return names;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

        );

/* =========================================================
   RENDER FOLDER
   ========================================================= */

function renderFolder(container) {

    const current =
        getCurrentNode();


    if (!current) {

        goHome();

        return;

    }


    /* BREADCRUMBS */

    const breadcrumbs =
        document.createElement(
            "div"
        );


    breadcrumbs.className =
        "breadcrumbs";


    const home =
        document.createElement(
            "span"
        );


    home.className =
        "breadcrumb";

    home.textContent =
        "Home";

    home.onclick =
        goHome;


    breadcrumbs.appendChild(
        home
    );


    for (
        let i = 0;
        i < navigationPath.length;
        i++
    ) {

        const separator =
            document.createElement(
                "span"
            );


        separator.className =
            "breadcrumb-separator";


        separator.textContent =
            "›";


        breadcrumbs.appendChild(
            separator
        );


        const crumb =
            document.createElement(
                "span"
            );


        crumb.className =
            "breadcrumb";


        const node =
            getNodeAtPath(
                navigationPath.slice(
                    0,
                    i + 1
                )
            );


        crumb.textContent =
            node
                ? node.name
                : "Unknown";


        const targetPath =
            navigationPath.slice(
                0,
                i + 1
            );


        crumb.onclick =
            function() {

                navigationPath =
                    targetPath;

                selectedIndex =
                    null;

                render();

            };


        breadcrumbs.appendChild(
            crumb
        );

    }


    container.appendChild(
        breadcrumbs
    );


    /* HEADING */

    const heading =
        document.createElement(
            "div"
        );


    heading.className =
        "page-heading";


    heading.innerHTML = `

        <div>

            <h2>
                ${escapeHTML(
                    current.name
                )}
            </h2>

            <p>
                Select something, then use the controls below.
            </p>

        </div>

    `;


    container.appendChild(
        heading
    );


    const list =
        current.children || [];


    /* EMPTY */

    if (
        list.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty glass";


        empty.innerHTML = `

            <div
                class="empty-icon"
            >
                📦
            </div>

            <div>
                Nothing has been added here yet.
            </div>

            <div
                style="
                    margin-top:8px;
                    opacity:.55;
                    font-size:13px;
                "
            >
                Use ＋ Add to put something here.
            </div>

        `;


        container.appendChild(
            empty
        );


        return;

    }


    /* GRID */

    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "card-grid";


    list.forEach(
        function(node,index) {

            if (
                node.type === "item"
            ) {

                grid.appendChild(
                    createItemCard(
                        node,
                        index
                    )
                );

            } else {

                grid.appendChild(
                    createFolderCard(
                        node,
                        index
                    )
                );

            }

        }
    );


    /* ADD CARD */

    grid.appendChild(
        createAddCard()
    );


    container.appendChild(
        grid
    );

}


/* =========================================================

function createFolderCard(
    node,
    index
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card glass";


    if (
        selectedIndex === index
    ) {

        card.classList.add(
            "selected"
        );

    }


    const childCount =
        node.children
            ? node.children.length
            : 0;


    card.innerHTML = `

        <button
            class="card-menu"
            title="Select"
        >
            ⋮
        </button>


        <div
            class="card-icon"
        >
            ${node.icon || "📁"}
        </div>


        <h3>
            ${escapeHTML(
                node.name
            )}
        </h3>


        <div
            class="card-description"
        >
            ${childCount}
            ${
                childCount === 1
                    ? "item"
                    : "items"
            }
        </div>

    `;


    card.onclick =
        function() {

            selectedIndex =
                index;

            openNode(
                index
            );

        };


    card
        .querySelector(
            ".card-menu"
        )
        .onclick =
        function(event) {

            event.stopPropagation();

            selectOnly(
                index
            );

        };


    return card;

}

/* =========================================================
   SELECT ONLY
   ========================================================= */

function selectOnly(index) {

    selectedIndex =
        index;

    render();

    showToast(
        "Selected. Use Edit, Rename or Delete below."
    );

}


/* =========================================================
   OPEN NODE
   ========================================================= */

function openNode(index) {

    const list =
        getCurrentList();


    const node =
        list[index];


    if (!node) {

        return;

    }


    if (
        node.type === "item"
    ) {

        selectOnly(
            index
        );

        return;

    }


    navigationPath.push(
        index
    );


    selectedIndex =
        null;


    render();

}


/* =========================================================
   GO HOME
   ========================================================= */

function goHome() {

    navigationPath =
        [];

    selectedIndex =
        null;

    render();

}


/* =========================================================
   GO BACK
   ========================================================= */

function goBack() {

    if (
        navigationPath.length === 0
    ) {

        showToast(
            "You're already home 🏠"
        );

        return;

    }


    navigationPath.pop();

    selectedIndex =
        null;

    render();

}

/* =========================================================

function deleteSelected() {

    if (
        selectedIndex === null
    ) {

        showToast(
            "Select something first."
        );

        return;

    }


    if (
        navigationPath.length === 0
    ) {

        showToast(
            "The Home page cannot be deleted."
        );

        return;

    }


    const list =
        getCurrentList();


    const node =
        list[selectedIndex];


    if (!node) {

        return;

    }


    const confirmed =
        confirm(
            `Delete "${node.name}"? ${
                node.type === "folder"
                    ? "Everything inside it will also be deleted."
                    : ""
            }`
        );


    if (!confirmed) {

        return;

    }


    list.splice(
        selectedIndex,
        1
    );


    selectedIndex =
        null;


    saveData();

    render();

    showToast(
        `"${node.name}" deleted.`
    );

}


/* =========================================================
   SAVE MODAL
   ========================================================= */

function saveModal() {

    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();


    if (!name) {

        showToast(
            "Give it a name first."
        );

        return;

    }


    const icon =
        document.getElementById(
            "iconInput"
        ).value.trim()
        || autoEmoji(name)
        || "📦";


    /* =============================================
       RENAME
       ============================================= */

    if (
        modalMode === "rename"
    ) {

        const list =
            getCurrentList();


        const node =
            list[editingIndex];


        if (node) {

            node.name =
                name;

            node.icon =
                icon;

        }


        saveData();

        closeModal();

        render();

        showToast(
            "Renamed successfully."
        );

        return;

    }


    /* =============================================
       EDIT ITEM
       ============================================= */

    if (
        modalMode === "editItem"
    ) {

        const list =
            getCurrentList();


        const item =
            list[editingIndex];


        if (item) {

            item.name =
                name;

            item.icon =
                icon;

            item.quantity =
                Math.max(
                    1,
                    Number(
                        document.getElementById(
                            "quantityInput"
                        ).value
                    ) || 1
                );


            item.missing =
                document.getElementById(
                    "missingInput"
                ).checked;

        }


        saveData();

        closeModal();

        render();

        showToast(
            "Inventory item updated."
        );

        return;

    }


    /* =============================================
       ADD
       ============================================= */

    if (
        modalMode === "add"
    ) {

        const type =
            document.getElementById(
                "typeInput"
            ).value;


        const newNode = {

            id:
                generateID(),

            name:
                name,

            icon:
                icon,

            type:
                type,

            children:
                []

        };


        if (
            type === "item"
        ) {

            newNode.quantity =
                Math.max(
                    1,
                    Number(
                        document.getElementById(
                            "quantityInput"
                        ).value
                    ) || 1
                );


            newNode.missing =
                document.getElementById(
                    "missingInput"
                ).checked;

        }


        const list =
            getCurrentList();


        list.push(
            newNode
        );


        saveData();

        closeModal();

        render();

        showToast(
            `"${name}" added.`
        );

    }

}


/* =========================================================
   GENERATE ID
   ========================================================= */

function generateID() {

    return (
        "item-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2,9)
    );

}


/* =========================================================
   OPEN MODAL
   ========================================================= */

function openModal() {

    document.getElementById(
        "modal"
    ).classList.add(
        "open"

    setTimeout(
        function() {

            document.getElementById(
                "nameInput"

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal() {

    document.getElementById(
        "modal"
    ).classList.remove(
        "open"
    );


    modalMode =
        null;

    editingIndex =
        null;


    document.getElementById(

    ).style.display =
        "block";


    document.getElementById(
        "iconArea"
    ).style.display =
        "block";

        "none";


    document.getElementById(
        "missingArea"
    ).style.display =

}


/* =========================================================
   MISSING ITEMS
   ========================================================= */

function getMissingItems() {

    const results = [];


    function scan(
        list,
        path
    ) {

        for (
            let i = 0;
            i < list.length;
            i++
        ) {

            const node =
                list[i];


            const currentPath =
                path.concat(i);


            if (
                node.type === "item" &&
                node.missing === true
            ) {

                results.push({

                    node:
                        node,

                    path:
                        currentPath,

                    pathNames:
                        getPathNames(
                            currentPath
                        )

                });

            }


            if (
                node.children &&
                node.children.length
            ) {

                scan(
                    node.children,
                    currentPath
                );

            }

        }

    }


    scan(
        inventoryData.rooms,
        []
    );


    return results;

}


/* =========================================================
   OPEN MISSING PAGE
   ========================================================= */

function openMissingPage() {

    navigationPath = [
        "__MISSING__"
    ];

    selectedIndex =
        null;

    renderMissingPage();

}


/* =========================================================
   RENDER MISSING PAGE
   ========================================================= */

function renderMissingPage() {

    const main =
        document.getElementById(
            "mainContent"
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "page-content";


    /* Breadcrumb */

    const breadcrumbs =
        document.createElement(
            "div"
        );


    breadcrumbs.className =
        "breadcrumbs";


    const home =
        document.createElement(
            "span"
        );


    home.className =
        "breadcrumb";

    home.textContent =
        "Home";

    home.onclick =
        goHome;


    breadcrumbs.appendChild(
        home
    );


    const separator =
        document.createElement(
            "span"
        );


    separator.className =
        "breadcrumb-separator";

    separator.textContent =
        "›";


    breadcrumbs.appendChild(
        separator
    );


    const current =
        document.createElement(
            "span"
        );


    current.className =
        "breadcrumb";

    current.textContent =
        "Missing Items";


    breadcrumbs.appendChild(
        current
    );


    wrapper.appendChild(
        breadcrumbs
    );


    /* Heading */

    const missing =
        getMissingItems();


    const heading =
        document.createElement(
            "div"
        );


    heading.className =
        "page-heading";


    heading.innerHTML = `

        <div>

            <h2>
                🚨 Missing Items
            </h2>

            <p>
                ${
                    missing.length
                }
                ${
                    missing.length === 1
                        ? "item is"
                        : "items are"
                }
                currently marked as missing.
            </p>

        </div>

    `;


    wrapper.appendChild(
        heading
    );


    /* Empty */

    if (
        missing.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty glass";


        empty.innerHTML = `

            <div
                class="empty-icon"
            >
                ✓
            </div>

            <div>
                Nothing is missing.
            </div>

        `;


        wrapper.appendChild(
            empty
        );


    } else {

        const list =
            document.createElement(
                "div"
            );


        list.className =
            "missing-list";


        missing.forEach(
            function(entry) {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "missing-list-item glass";


                item.innerHTML = `

                    <div
                        class="missing-list-icon"
                    >
                        ${entry.node.icon || "📦"}
                    </div>


                    <div>

                        <div
                            class="missing-list-name"
                        >
                            ${escapeHTML(
                                entry.node.name
                            )}
                        </div>


                        <div
                            class="missing-list-path"
                        >
                            📍
                            ${escapeHTML(
                                entry.pathNames.join(
                                    " → "
                                )
                            )}
                        </div>

                    </div>


                    <div
                        class="missing-arrow"
                    >
                        →
                    </div>

                `;


                item.onclick =
                    function() {

                        goToMissingItem(
                            entry
                        );

                    };


                list.appendChild(
                    item
                );

            }
        );


        wrapper.appendChild(
            list
        );

    }


    main.innerHTML =
        "";


    main.appendChild(
        wrapper
    );


    updateTaskbar();

}


/* =========================================================
   GO TO MISSING ITEM
   ========================================================= */

function goToMissingItem(entry) {

    /*
        We do not directly use the magic
        "__MISSING__" path after this point.

        Instead we use the real path.
    */


    navigationPath =
        entry.path.slice(
            0,
            -1
        );


    selectedIndex =
        entry.path[
            entry.path.length - 1
        ];


    render();

    showToast(
        `Located ${entry.node.name} 📍`
    );

}


/* =========================================================
   SPECIAL RENDER CHECK
   ========================================================= */

const originalRender =
    render;


render =
    function() {

        if (
            navigationPath.length === 1 &&
            navigationPath[0] === "__MISSING__"
        ) {

            renderMissingPage();

            return;

        }


        originalRender();

    };


/* =========================================================
   MODAL ENTER KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const modal =
            document.getElementById(
                "modal"
            );


        if (
            event.key === "Escape" &&
            modal.classList.contains(
                "open"
            )
        ) {

            closeModal();

            return;

        }


        if (
            event.key === "Enter" &&
            modal.classList.contains(
                "open"
            ) &&
            event.target.tagName !== "TEXTAREA"
        ) {

            saveModal();

            return;

        }


        if (
            event.key === "Backspace" &&
            !isTyping() &&
            !modal.classList.contains(
                "open"
            )
        ) {

            goBack();

        }

    }
);


/* =========================================================
   CHECK IF USER IS TYPING
   ========================================================= */

function isTyping() {

    const active =
        document.activeElement;


    if (!active) {

        return false;

    }


    return (

        active.tagName === "INPUT" ||

        active.tagName === "TEXTAREA" ||

        active.tagName === "SELECT"

    );

}


/* =========================================================
   MODAL CLICK OUTSIDE
   ========================================================= */

document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2400
        );

}


/* =========================================================
   LIQUID RIPPLE
   ========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const button =
            event.target.closest(
                ".btn, .task"
            );


        if (!button) {

            return;

        }


        if (
            button.classList.contains(
                "disabled"
            )
        ) {

            return;

        }


        const rect =
            button.getBoundingClientRect();


        const ripple =
            document.createElement(
                "span"
            );


        ripple.className =
            "ripple";


        ripple.style.left =
            `${
                event.clientX -
                rect.left
            }px`;


        ripple.style.top =
            `${
                event.clientY -
                rect.top
            }px`;


        button.appendChild(
            ripple
        );


        setTimeout(
            function() {

                ripple.remove();

            },
            800
        );

    }
);


/* =========================================================
   INITIAL SAVE + RENDER
   ========================================================= */

saveData();

render();


</script>
